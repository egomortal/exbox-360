# Builds Ex-Box Setup (one-file Windows app) and attaches it to the GitHub release.
# Copied from Omnibloom Setup's workflow and adapted: Windows only, because Ex-Box Setup uses WSL
# (Ubuntu) on the user's PC to build the Avatar Editor and libc.prx.
name: Ex-Box Setup

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller==6.16.0 pillow==12.0.0
      - name: Setup's tests
        run: python -B -m unittest discover -s dashboard/tests -p test_installer.py -v
      - name: Build one-file app
        run: pyinstaller --noconfirm --distpath dashboard/dist --workpath dashboard/.build-setup dashboard/exbox-setup.spec
      - name: Check the built app (practice install, no PS5)
        run: python -B dashboard/tests/frozen_check.py dashboard/dist/ExBox-Setup.exe
      - name: Checksum
        shell: bash
        run: |
          cd dashboard/dist
          python -c "import hashlib,sys;p=sys.argv[1];print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p)" ExBox-Setup.exe > ExBox-Setup.exe.sha256
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dashboard/dist/ExBox-Setup.exe dashboard/dist/ExBox-Setup.exe.sha256 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ExBox-Setup
          path: dashboard/dist/ExBox-Setup.exe*
